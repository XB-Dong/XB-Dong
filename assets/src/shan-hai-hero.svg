<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">董信步 · 以码为舟，山海可渡</title>
  <desc id="hero-desc">一卷黛青色的现代东方山水。金色月轮与星轨悬于青绿群山之上，山间有亭，水上有舟。左侧题字：以码为舟，山海可渡。在工程与研究之间，探索更远的山海。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2226"/>
      <stop offset=".58" stop-color="#102d31"/>
      <stop offset="1" stop-color="#0c2226"/>
    </linearGradient>
    <radialGradient id="moon-halo">
      <stop offset="0" stop-color="#b8c798" stop-opacity=".1"/>
      <stop offset=".46" stop-color="#8eb394" stop-opacity=".035"/>
      <stop offset="1" stop-color="#8eb394" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#d4d1a8"/>
      <stop offset=".58" stop-color="#9daf90"/>
      <stop offset="1" stop-color="#769b88"/>
    </linearGradient>
    <linearGradient id="far-mountain" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#385f58"/>
      <stop offset="1" stop-color="#173d3b" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="middle-mountain" x1=".3" y1="0" x2=".6" y2="1">
      <stop stop-color="#4f9278"/>
      <stop offset=".48" stop-color="#2e6f62"/>
      <stop offset="1" stop-color="#15453f"/>
    </linearGradient>
    <linearGradient id="jade-ridge" x1=".2" y1="0" x2=".9" y2="1">
      <stop stop-color="#70a68a"/>
      <stop offset=".28" stop-color="#3d896f"/>
      <stop offset=".69" stop-color="#216554"/>
      <stop offset="1" stop-color="#15493f"/>
    </linearGradient>
    <linearGradient id="foreground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#286657"/>
      <stop offset=".6" stop-color="#16443e"/>
      <stop offset="1" stop-color="#0e302f"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7baba0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#91b9a8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#91b9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2cca0"/>
      <stop offset=".6" stop-color="#bd9f65"/>
      <stop offset="1" stop-color="#8d784c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#143a39" stop-opacity="0"/>
      <stop offset="1" stop-color="#071c21" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="text-shade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0c2226" stop-opacity=".52"/>
      <stop offset=".75" stop-color="#0c2226" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0c2226" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1280" height="520" rx="18"/></clipPath>
    <style>
      .calligraphy { font-family: KaiTi, STKaiti, "Kaiti SC", SimSun, serif; }
      .small-cn { font-family: SimSun, "Songti SC", serif; }
      .latin { font-family: "Segoe UI", Arial, sans-serif; }
      .star { animation: star-breath 7s ease-in-out infinite; }
      .star-late { animation-delay: -3s; }
      @keyframes star-breath { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
    </style>
  </defs>

