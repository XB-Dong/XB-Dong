    <rect width="632" height="520" fill="url(#text-shade)"/>

    <!-- The generous left margin reads as the blank silk of a hanging scroll. -->
    <path d="M84 72h26" stroke="#b9a16e" stroke-width="1"/>
    <text x="123" y="77" fill="#bbc8b6" font-size="15" letter-spacing="2" class="small-cn">董信步 <tspan fill="#6f9086" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2.5"> / XB-DONG</tspan></text>
    <text x="78" y="191" fill="#e6debe" font-size="75" letter-spacing="6" class="calligraphy">以码为舟</text>
    <text x="78" y="284" fill="#e6debe" font-size="75" letter-spacing="6" class="calligraphy">山海可渡</text>

