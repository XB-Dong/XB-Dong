    <path d="M843 431C879 414 898 397 926 398 950 399 964 414 988 409 1017 402 1026 380 1054 382 1082 384 1096 403 1124 400 1149 397 1166 374 1192 377 1221 380 1242 405 1280 398V520H843Z" fill="url(#foreground)"/>
