    <text x="88" y="373" fill="#9fb9ad" font-size="16" letter-spacing="2" class="small-cn">在工程与研究之间，探索更远的山海</text>
    <text x="89" y="422" fill="#c0af82" font-size="11" letter-spacing="3" class="latin">AI · FULL STACK · OPTIMIZATION</text>

