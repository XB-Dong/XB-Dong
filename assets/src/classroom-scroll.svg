    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#173e40"/><stop offset="1" stop-color="#0c262c"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#b6c3a0" stroke-width=".5" opacity=".12"/></pattern>
    <g id="student"><path d="M-26 36Q-25 5 0 4Q25 5 26 36" fill="#2c6866"/><circle cy="-11" r="17" fill="#83aaa0"/><path d="M-17-14Q-17-36 0-30Q20-31 17-10Q7-22-10-19Z" fill="#183a3a"/></g>
    <style>.serif{font-family:KaiTi,STKaiti,SimSun,serif}.sans{font-family:'Segoe UI','Microsoft YaHei',sans-serif}.mono{font-family:Consolas,monospace}</style>
